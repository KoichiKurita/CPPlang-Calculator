name: CI

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:

# 最小権限：既定は読み取りのみ。Release 作成ジョブだけ書き込みを付与する
permissions:
  contents: read

# 同じブランチで新しい push があったら、古い実行をキャンセルして待ち時間と実行時間を節約する
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Linux：Qt なしでドメイン層・アプリ層をテスト（ASan/UBSan でメモリ不正を検出）----
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後続のステップに GitHub のトークンを残さない

      - name: Configure (tests only, sanitizers)
        run: >
          cmake -S . -B build
          -DCALC_BUILD_GUI=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---- 静的解析：フォーマット / clang-tidy / cppcheck ----
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後続のステップに GitHub のトークンを残さない

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy-18 cppcheck qt6-base-dev

      # clang-format はローカル（MSYS2）と同じ版に固定する（版によって整形結果が異なるため）
      - name: Install clang-format (pinned)
        run: |
          pipx install clang-format==23.1.3
          clang-format --version

      # 整形した結果に差分があれば失敗（差分をログに表示）
      - name: clang-format (check)
        run: |
          git ls-files 'src/*.cpp' 'src/*.h' 'test/*.cpp' 'fuzz/*.cpp' | xargs clang-format -i
          git diff --exit-code

      # clang-tidy はコンパイルオプションを compile_commands.json から読む
      - name: Configure (export compile_commands.json)
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCALC_BUILD_TESTS=OFF

      # Qt の moc が生成するファイルを用意するためにビルドしておく
      - name: Build
        run: cmake --build build --parallel

      - name: clang-tidy
        run: run-clang-tidy-18 -p build -quiet "$PWD/src/.*"

      - name: cppcheck
        run: >
          cppcheck --enable=warning,style,performance,portability
          --std=c++17 --language=c++ -I src --library=qt
          --inline-suppr --suppress=missingIncludeSystem
          --error-exitcode=1
          src test fuzz
  
        # ---- カバレッジ計測（gcovr）：目標未達で失敗。main への push 時は GitHub Pages に公開 ----
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後続のステップに GitHub のトークンを残さない

      - name: Install gcovr
        run: pipx install gcovr==8.8

      - name: Configure (coverage)
        run: >
          cmake -S . -B build
          -DCALC_BUILD_GUI=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCALC_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      # gtest_discover_tests がビルド時にテストを実行して作った計測データを消してから計測する
      - name: Test
        run: |
          find build -name '*.gcda' -delete
          ctest --test-dir build --output-on-failure

      - name: Coverage report
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'src/' --object-directory build \
            --exclude-unreachable-branches --exclude-throw-branches --exclude-noncode-lines \
            --print-summary \
            --html-details coverage/index.html --html-title "CPPlang-Calculator Coverage" \
            --json-summary coverage/summary.json \
            --markdown-summary coverage/summary.md \
            --fail-under-line 95 --fail-under-branch 90
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      # shields.io の endpoint バッジ用 JSON を作る
      - name: Create badge JSON
        run: |
          python3 - <<'PY'
          import json
          pct = json.load(open("coverage/summary.json"))["line_percent"]
          color = "brightgreen" if pct >= 95 else "green" if pct >= 90 else "yellow" if pct >= 80 else "red"
          json.dump({"schemaVersion": 1, "label": "coverage", "message": f"{pct:.1f}%", "color": color},
                    open("coverage/badge.json", "w"))
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: coverage/

  # ---- カバレッジレポートを GitHub Pages に公開（main への push 時のみ）----
  deploy-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      pages: write    # Pages へのデプロイ
      id-token: write # デプロイ元の正当性を OIDC で証明
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # ---- ファジング：式の評価器にランダムな入力を与え、クラッシュしないことを確かめる ----
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後続のステップに GitHub のトークンを残さない

      - name: Install libFuzzer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev

      - name: Configure and Build (libFuzzer + ASan + UBSan)
        run: |
          cmake -S . -B build -DCALC_BUILD_GUI=OFF -DCALC_BUILD_TESTS=OFF -DCALC_BUILD_FUZZERS=ON \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel

      # 長さの上限（256 文字）を超える入力も試すため -max_len は上限より大きくする
      - name: Fuzz (60 seconds)
        run: |
          mkdir -p corpus
          ./build/fuzz/ExpressionFuzzer corpus fuzz/corpus \
            -dict=fuzz/expression.dict -max_len=512 -max_total_time=60 -print_final_stats=1

      # クラッシュした場合は、再現用の入力（crash-*）を保存する
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crash-*

  # ---- Linux：GUI ビルド + テスト（GUI テスト含む）+ AppImage 作成 ----
  linux-gui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後続のステップに GitHub のトークンを残さない

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools qt6-qpa-plugins libgl1-mesa-dev ninja-build

      - name: Configure and Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # linuxdeploy で Qt を同梱した AppImage を作る（ツールは版を固定し SHA256 で検証）
      - name: Package (AppImage)
        run: |
          set -euo pipefail
          mkdir -p tools
          LD_URL=https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          QT_URL=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -sSfL -o tools/linuxdeploy-x86_64.AppImage "$LD_URL"
          curl -sSfL -o tools/linuxdeploy-plugin-qt-x86_64.AppImage "$QT_URL"
          # ダウンロードしたツールが改ざんされていないことを SHA256 で検証する
          sha256sum -c <<'SUMS'
          c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  tools/linuxdeploy-x86_64.AppImage
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  tools/linuxdeploy-plugin-qt-x86_64.AppImage
          SUMS
          chmod +x tools/*.AppImage

          # CI には FUSE がないため、AppImage を展開して実行する
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=/usr/bin/qmake6
          # スモークテストを画面なしで実行できるよう、offscreen プラグインも同梱する
          export EXTRA_PLATFORM_PLUGINS=libqoffscreen.so
          export LDAI_OUTPUT=QtCalculator-linux-x86_64.AppImage

          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/src/QtCalculator \
            --desktop-file packaging/linux/qtcalculator.desktop \
            --icon-file packaging/linux/qtcalculator.png \
            --plugin qt \
            --output appimage

          # 起動確認（スモークテスト）
          QT_QPA_PLATFORM=offscreen ./QtCalculator-linux-x86_64.AppImage --smoke-test
          sha256sum QtCalculator-linux-x86_64.AppImage > QtCalculator-linux-x86_64.AppImage.sha256
          cat QtCalculator-linux-x86_64.AppImage.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QtCalculator-Linux
          path: |
            QtCalculator-linux-x86_64.AppImage
            QtCalculator-linux-x86_64.AppImage.sha256

  # ---- macOS：GUI ビルド + テスト（GUI テスト含む）+ .dmg 作成 ----
  macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後続のステップに GitHub のトークンを残さない

      - name: Install Qt
        run: brew install qt ninja

      - name: Configure and Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # macdeployqt で Qt を .app に同梱し、.dmg にまとめる
      - name: Package (.dmg)
        run: |
          set -euo pipefail
          APP=build/src/QtCalculator.app
          "$(brew --prefix qt)/bin/macdeployqt" "$APP"
          # macdeployqt がライブラリを書き換えると署名が無効になるため、アドホック署名をし直す
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          # 起動確認（スモークテスト）
          "$APP/Contents/MacOS/QtCalculator" --smoke-test
          hdiutil create -volname QtCalculator -srcfolder "$APP" -ov -format UDZO QtCalculator-macos-arm64.dmg
          shasum -a 256 QtCalculator-macos-arm64.dmg > QtCalculator-macos-arm64.dmg.sha256
          cat QtCalculator-macos-arm64.dmg.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QtCalculator-macOS
          path: |
            QtCalculator-macos-arm64.dmg
            QtCalculator-macos-arm64.dmg.sha256

  # ---- Windows：GUI ビルド + テスト + 配布用パッケージ作成 ----
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後続のステップに GitHub のトークンを残さない

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            git
            zip

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci

      # || true を外す：テストが失敗したら CI を失敗させる
      - name: Run tests
        shell: msys2 {0}
        run: ctest --test-dir build-ci --output-on-failure

      # 実行ファイルに ASLR / DEP が有効になっているかを検証（無効なら失敗）
      - name: Verify binary hardening
        shell: msys2 {0}
        run: |
          objdump -p build-ci/src/QtCalculator.exe | grep -A4 DllCharacteristics
          for flag in DYNAMIC_BASE HIGH_ENTROPY_VA NX_COMPAT; do
            objdump -p build-ci/src/QtCalculator.exe | grep -q "$flag" || { echo "::error::$flag is not set"; exit 1; }
          done

      # exe 単体では Qt 未導入の PC で起動できないため、Qt / MinGW の DLL を同梱する
      - name: Package (windeployqt + dependent DLLs)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp build-ci/src/QtCalculator.exe deploy/

          # windeployqt の実行ファイル名は環境によって異なるため、見つかったものを使う
          WDQ=$(command -v windeployqt6 || command -v windeployqt || echo /ucrt64/share/qt6/bin/windeployqt.exe)
          echo "Using: $WDQ"
          "$WDQ" --release --no-translations deploy/QtCalculator.exe

          # windeployqt が拾わない MSYS2 側の依存 DLL を ldd で探してコピー（依存の依存も拾うため3回）
          for i in 1 2 3; do
            find deploy \( -name '*.exe' -o -name '*.dll' \) | while read -r f; do
              ldd "$f" | awk '$3 ~ /^\/ucrt64\/bin\// {print $3}'
            done | sort -u | xargs -r -I{} cp -n {} deploy/
          done

          (cd deploy && zip -qr ../QtCalculator-windows-x64.zip .)
          sha256sum QtCalculator-windows-x64.zip > QtCalculator-windows-x64.zip.sha256
          cat QtCalculator-windows-x64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QtCalculator-Windows
          path: |
            QtCalculator-windows-x64.zip
            QtCalculator-windows-x64.zip.sha256

  # ---- タグ push 時のみ Release を作成（両ジョブの成功が条件）----
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ linux-test, static-analysis, coverage, fuzz, windows-build, linux-gui, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 3つの OS の配布物（QtCalculator-Windows / -Linux / -macOS）をまとめて取得する
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: QtCalculator-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            QtCalculator-windows-x64.zip
            QtCalculator-windows-x64.zip.sha256
            QtCalculator-linux-x86_64.AppImage
            QtCalculator-linux-x86_64.AppImage.sha256
            QtCalculator-macos-arm64.dmg
            QtCalculator-macos-arm64.dmg.sha256
